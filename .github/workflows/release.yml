name: Publish to NuGet.org

on:
  push:
    branches: [master]
    paths:
      - src/IqOptionApiDotNet/IqOptionApiDotNet.csproj
  workflow_dispatch:

permissions:
  contents: read

# Serialize publication attempts; never cancel a package upload in progress.
concurrency:
  group: nuget-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test version detector
        run: python3 .github/scripts/test_nuget_version.py
      - name: Detect package version change
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: python3 .github/scripts/nuget-version.py
      - name: Setup .NET
        if: steps.version.outputs.publish == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Restore
        if: steps.version.outputs.publish == 'true'
        run: dotnet restore tests/IqOptionApiDotNet.Tests/IqOptionApiDotNet.Tests.csproj
      - name: Test
        if: steps.version.outputs.publish == 'true'
        run: dotnet test tests/IqOptionApiDotNet.Tests/IqOptionApiDotNet.Tests.csproj --configuration Release --no-restore
      - name: Pack
        if: steps.version.outputs.publish == 'true'
        run: dotnet pack src/IqOptionApiDotNet/IqOptionApiDotNet.csproj --configuration Release --no-restore --output artifacts
      - name: Save package
        if: steps.version.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: artifacts/*.nupkg
          if-no-files-found: error
      - name: Authenticate with NuGet Trusted Publishing
        if: steps.version.outputs.publish == 'true'
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER || 'Sabidos' }}
      - name: Publish to NuGet.org
        if: steps.version.outputs.publish == 'true'
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
